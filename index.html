<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="refresh" content="60">
<title>竞彩盘口看板</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="topbar"><div class="wrap">
  <div class="brand">竞彩盘口看板 <small>可投注 · 未截止</small></div>
  <div class="actions">
    <span class="muted">清单版本：da39a3ee5e</span>
    <a class="btn" href="https://github.com/Jincheng-Z/jingcai-odds"
       target="_blank" rel="noopener">GitHub</a>
  </div>
</div></div>
<div class="wrap">
  <div class="card">
    <h2>赛事清单 <span class="muted">（0 场）</span></h2>
    <div class="search"><input id="q" placeholder="搜索编号 / 联赛 / 球队…"></div>
    <div class="tablewrap">
      <table>
        <thead><tr>
          <th>截止（北京）</th><th>编号</th><th>联赛</th><th>对阵</th>
          <th>开赛（北京）</th><th>剩余</th><th>状态</th><th>详细</th>
        </tr></thead>
        <tbody><tr><td colspan="8"><div class="empty">当前没有可投注且未截止的赛事。</div></td></tr></tbody>
      </table>
    </div>
    <p class="muted">页面每 60 秒自动刷新；剩余时间由浏览器计算；
    只显示可投注且未截止的赛事。</p>
  </div>
  <div class="footer">竞彩盘口精算系统 · GitHub Pages 静态镜像 · 数据仅供参考</div>
</div>
<script src="assets/app.js"></script>
</body>
</html>
